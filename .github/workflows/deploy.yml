name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: dev-ops/DeployReady/app

      - name: Run tests
        run: npm test
        working-directory: dev-ops/DeployReady/app

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Railway deploy via API
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploymentTrigger(input: { projectId: \"${{ secrets.RAILWAY_PROJECT_ID }}\" }) { id } }"}' \
            https://backboard.railway.app/graphql/v2

      - name: Verify health check
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RAILWAY_PUBLIC_URL }}/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed: $STATUS"
            exit 1
          fi
