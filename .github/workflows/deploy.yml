name: Deploy Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: dev-ops/DeployReady/app

      - name: Run tests
        run: npm test
        working-directory: dev-ops/DeployReady/app

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach --service AmaliTech-DEG-Project-based-challenges
        working-directory: dev-ops/DeployReady
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify health check
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RAILWAY_PUBLIC_URL }}/health)
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed"
          else
            echo "Health check failed: $STATUS"
            exit 1
          fi
