name: Deploy

# Trigger the workflow on push to main branch
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Step 3: Run automated tests - fails the pipeline if tests don't pass
      - name: Run tests
        run: |
          cd app
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Deploy to Railway using Railway CLI
      # Railway automatically builds from Dockerfile and deploys the container
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Install Railway CLI
          npm i -g @railway/cli
          
          # Deploy using Railway - automatically uses Dockerfile
          railway up --detach
        shell: bash
